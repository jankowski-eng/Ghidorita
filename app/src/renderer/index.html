<!doctype html>
<html>
  <head><meta charset="UTF-8" />
    <!-- Monaco bundled locally needs: workers (worker-src blob: covers its fallback, 'self' the bundled worker file), inline styles (it injects <style>; React sets style=), a data: font for its icons. No eval, no remote origins; the only network access is the sidecar's WebSocket on loopback. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src ws://127.0.0.1:*; worker-src 'self' blob:; base-uri 'none'; form-action 'none'" /><title>Ghidorita</title></head>
  <body><div id="root"></div><script type="module" src="./main.tsx"></script></body>
</html>
